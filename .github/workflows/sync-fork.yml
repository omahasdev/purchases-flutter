name: Sync Fork

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Sync fork via API
        id: sync
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const result = await github.rest.repos.mergeUpstream({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main'
              });
              core.setOutput('status', result.data.merge_type || 'up-to-date');
              core.info(`Sync result: ${result.data.message}`);
            } catch (error) {
              // 409 = merge conflict, 422 = other sync failure (e.g. divergent history)
              if (error.status === 409 || error.status === 422) {
                core.setOutput('status', 'conflict');
                core.setOutput('error_message', error.message);
                core.setFailed(`Sync failed (HTTP ${error.status}): ${error.message}`);
              } else {
                throw error;
              }
            }

      - name: Notify on conflict
        if: failure() && steps.sync.outputs.status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'sync-conflict';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const date = new Date().toISOString().split('T')[0];
            const errorMessage = '${{ steps.sync.outputs.error_message }}' || 'Unknown error';

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Sync failed again on ${date}.\n\nError: ${errorMessage}\n\nWorkflow run: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Fork sync failed: merge conflict (${date})`,
                body: `The automated fork sync failed.\n\n**Error**: ${errorMessage}\n\n**Action required**: Manually resolve conflicts and merge.\n\n\`\`\`bash\ngit fetch upstream\ngit merge upstream/main\n# Resolve conflicts\ngit add .\ngit commit\ngit push\n\`\`\`\n\nWorkflow run: ${runUrl}`,
                labels: [label],
                assignees: ['omahasdev']
              });
            }

      - name: Close sync-conflict issues on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict'
            });
            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Fork synced successfully. Closing.'
              });
            }
