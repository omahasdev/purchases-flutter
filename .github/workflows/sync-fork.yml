name: Sync Fork

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/RevenueCat/purchases-flutter.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check if behind upstream
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream."
          else
            echo "Fork is $BEHIND commits behind upstream."
          fi

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        id: merge
        continue-on-error: true
        run: |
          git merge upstream/main --no-edit
          echo "merge_success=true" >> $GITHUB_OUTPUT

      - name: Handle merge conflict
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.merge_success != 'true'
        run: |
          git merge --abort
          echo "::error::Merge failed due to conflicts. Manual intervention required."

      - name: Notify on conflict
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.merge_success != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'sync-conflict';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const date = new Date().toISOString().split('T')[0];

            // Find existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });

            if (issues.data.length > 0) {
              // Add comment to existing issue to trigger notification
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Sync failed again on ${date}.\n\nWorkflow run: ${runUrl}`
              });
            } else {
              // Create new issue assigned to repo owner
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Fork sync failed: merge conflict (${date})`,
                body: `The automated fork sync failed due to merge conflicts.\n\n**Action required**: Manually resolve conflicts and merge.\n\n\`\`\`bash\ngit fetch upstream\ngit merge upstream/main\n# Resolve conflicts\ngit add .\ngit commit\ngit push\n\`\`\`\n\nWorkflow run: ${runUrl}`,
                labels: [label],
                assignees: ['omahasdev']
              });
            }

      - name: Close sync-conflict issues on success
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.merge_success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict'
            });
            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Fork synced successfully. Closing.'
              });
            }

      - name: Push changes
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.merge_success == 'true'
        run: git push origin main
