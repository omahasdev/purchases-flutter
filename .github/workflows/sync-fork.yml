name: Sync Fork

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Sync fork via API
        id: sync
        uses: actions/github-script@v7
        with:
          # GITHUB_TOKEN cannot write .github/workflows/** — the `workflows` scope
          # does not exist in the `permissions:` block, only on PATs/GitHub Apps.
          # Add a SYNC_TOKEN secret (fine-grained PAT, Contents + Workflows: write)
          # to make upstream workflow changes sync automatically.
          github-token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            try {
              const result = await github.rest.repos.mergeUpstream({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main'
              });
              core.setOutput('reason', result.data.merge_type || 'up-to-date');
              core.info(`Sync result: ${result.data.message}`);
            } catch (error) {
              const message = error.message || 'Unknown error';
              const isWorkflowScope = /without .?workflows.? permission/i.test(message);

              let reason;
              if (isWorkflowScope) {
                reason = 'workflow-scope';
              } else if (error.status === 409) {
                reason = 'conflict';
              } else if (error.status === 422) {
                reason = 'unmergeable';
              } else {
                throw error;
              }

              core.setOutput('reason', reason);
              core.setOutput('error_message', message);
              core.setFailed(`Sync failed (HTTP ${error.status}, ${reason}): ${message}`);
            }

      - name: Notify on sync failure
        if: failure() && steps.sync.outputs.reason != ''
        uses: actions/github-script@v7
        env:
          REASON: ${{ steps.sync.outputs.reason }}
          ERROR_MESSAGE: ${{ steps.sync.outputs.error_message }}
        with:
          script: |
            const label = 'sync-conflict';
            const reason = process.env.REASON;
            const errorMessage = process.env.ERROR_MESSAGE || 'Unknown error';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];

            const manualMerge = [
              '```bash',
              'git fetch upstream',
              'git merge upstream/main',
              'git push origin main',
              '```',
            ].join('\n');

            const details = {
              'workflow-scope': {
                title: `Fork sync blocked: upstream changed a workflow file (${date})`,
                body: [
                  'The automated fork sync was **not** blocked by a merge conflict.',
                  '',
                  'Upstream added or modified a file under `.github/workflows/`, and the',
                  "Actions `GITHUB_TOKEN` is not permitted to write workflow files. This is a",
                  'hard GitHub restriction: `workflows` is not an available scope in a',
                  "workflow's `permissions:` block — only personal access tokens and GitHub",
                  'Apps can hold it.',
                  '',
                  '**Fix now** — merge locally and push with your own credentials:',
                  '',
                  manualMerge,
                  '',
                  '**Fix permanently** — create a fine-grained PAT scoped to this repository',
                  'with `Contents: read and write` and `Workflows: read and write`, then add it',
                  'as a repository secret named `SYNC_TOKEN`. This workflow picks it up',
                  'automatically.',
                ].join('\n'),
              },
              conflict: {
                title: `Fork sync failed: merge conflict (${date})`,
                body: [
                  'The automated fork sync hit a genuine merge conflict between this',
                  "fork's customizations and upstream.",
                  '',
                  '**Action required** — resolve manually:',
                  '',
                  manualMerge,
                  '',
                  'If the conflict is a delete/modify on a file this fork intentionally',
                  'removed, prefer keeping the upstream file and disabling the workflow via',
                  '`gh workflow disable <file>` instead — a deleted file conflicts forever.',
                ].join('\n'),
              },
              unmergeable: {
                title: `Fork sync failed: branches cannot be merged (${date})`,
                body: [
                  'The automated fork sync could not merge upstream into `main` (HTTP 422).',
                  'This usually means divergent history or a rewritten upstream branch.',
                  '',
                  '**Action required** — inspect and merge manually:',
                  '',
                  manualMerge,
                ].join('\n'),
              },
            }[reason];

            if (!details) {
              core.setFailed(`Unrecognized sync failure reason: ${reason}`);
              return;
            }

            const body = `${details.body}\n\n**Error**: ${errorMessage}\n\nWorkflow run: ${runUrl}`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Sync failed again on ${date} (${reason}).\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: details.title,
                body,
                labels: [label],
                assignees: ['omahasdev']
              });
            }

      - name: Close sync-conflict issues on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict'
            });
            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Fork synced successfully. Closing.'
              });
            }
