name: Sync Fork

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          # Full history: the merge below needs a merge base with upstream.
          fetch-depth: 0

      - name: Merge upstream
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          # The bot identity Actions attributes GITHUB_TOKEN commits to.
          COMMIT_NAME: 'github-actions[bot]'
          COMMIT_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          WORKFLOW_DIR: .github/workflows
        run: |
          set -euo pipefail

          fail() {
            {
              echo "reason=$1"
              echo "error_message<<SYNC_REPORT_EOF"
              echo "$2"
              echo "SYNC_REPORT_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          }

          parent=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent | "\(.clone_url) \(.default_branch)"')
          read -r upstream_url upstream_branch <<< "$parent"
          echo "Upstream: $upstream_url ($upstream_branch)"

          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git remote add upstream "$upstream_url"
          git fetch --no-tags upstream "$upstream_branch"

          pre=$(git rev-parse HEAD)

          if git merge-base --is-ancestor FETCH_HEAD "$pre"; then
            echo 'reason=up-to-date' >> "$GITHUB_OUTPUT"
            echo 'Already up to date with upstream.'
            exit 0
          fi

          if ! merge_log=$(git merge --no-commit --no-ff FETCH_HEAD 2>&1); then
            echo "$merge_log"
            if [ ! -f .git/MERGE_HEAD ]; then
              fail merge-failed "$merge_log"
            fi
            # Conflicts under WORKFLOW_DIR are expected and self-resolving: that
            # directory is overwritten wholesale in the next step.
            blocking=$(git diff --name-only --diff-filter=U | grep -v "^$WORKFLOW_DIR/" || true)
            if [ -n "$blocking" ]; then
              git merge --abort
              fail conflict "$blocking"
            fi
          fi

          # GitHub refuses a GITHUB_TOKEN push that creates or updates any file under
          # .github/workflows, and `workflows` is not a grantable scope in a
          # permissions: block -- only PATs and GitHub Apps can hold it. So keep this
          # fork's own copies verbatim and let the merge carry everything else. The
          # push then has an empty net diff for this directory and is allowed.
          #
          # Consequence: upstream workflow changes never reach this fork. That is
          # intended -- every upstream workflow here is disabled at the repo level
          # anyway (see `gh workflow list --all`).
          rm -rf "$WORKFLOW_DIR"
          git add -A "$WORKFLOW_DIR"
          git checkout "$pre" -- "$WORKFLOW_DIR"

          git commit --no-edit --quiet

          if [ -n "$(git diff --name-only "$pre" HEAD -- "$WORKFLOW_DIR")" ]; then
            fail workflow-dir-dirty "$(git diff --stat "$pre" HEAD -- "$WORKFLOW_DIR")"
          fi

          if ! push_log=$(git push origin "HEAD:$GITHUB_REF_NAME" 2>&1); then
            echo "$push_log"
            fail push-rejected "$push_log"
          fi

          echo 'reason=merged' >> "$GITHUB_OUTPUT"
          git --no-pager log --oneline "$pre..HEAD"

      - name: Notify on sync failure
        if: failure() && steps.sync.outputs.reason != ''
        uses: actions/github-script@v7
        env:
          REASON: ${{ steps.sync.outputs.reason }}
          ERROR_MESSAGE: ${{ steps.sync.outputs.error_message }}
        with:
          script: |
            const label = 'sync-conflict';
            const reason = process.env.REASON;
            const errorMessage = process.env.ERROR_MESSAGE || 'Unknown error';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];

            const manualMerge = [
              '```bash',
              'git fetch upstream',
              'git merge upstream/main',
              'git push origin main',
              '```',
            ].join('\n');

            const workflowNote = [
              'Note: a manual merge also brings upstream `.github/workflows/**` changes',
              'into this fork, which the automated sync deliberately skips. Disable any',
              'newly arrived workflow with `gh workflow disable <file>`.',
            ].join('\n');

            const details = {
              conflict: {
                title: `Fork sync failed: merge conflict (${date})`,
                body: [
                  'The automated fork sync hit a genuine merge conflict between this',
                  "fork's customizations and upstream, outside `.github/workflows/**`.",
                  '',
                  '**Action required** — resolve manually:',
                  '',
                  manualMerge,
                  '',
                  workflowNote,
                ].join('\n'),
              },
              'merge-failed': {
                title: `Fork sync failed: merge could not start (${date})`,
                body: [
                  'The automated fork sync could not begin a merge with upstream. This is',
                  'not a content conflict — it usually means divergent or rewritten',
                  'history on either side.',
                  '',
                  '**Action required** — inspect and merge manually:',
                  '',
                  manualMerge,
                ].join('\n'),
              },
              'workflow-dir-dirty': {
                title: `Fork sync failed: workflow files changed unexpectedly (${date})`,
                body: [
                  'The sync merged upstream but the resulting commit still altered',
                  '`.github/workflows/**`, which `GITHUB_TOKEN` may not push. The guard',
                  'caught this before the push, so nothing was written.',
                  '',
                  'This means the restore step in `sync-fork.yml` is broken — it should',
                  'leave that directory byte-identical to the pre-merge commit.',
                ].join('\n'),
              },
              'push-rejected': {
                title: `Fork sync failed: push rejected (${date})`,
                body: [
                  'The merge succeeded but pushing it was rejected. If the message',
                  'mentions `workflows` permission, the restore step in `sync-fork.yml`',
                  'is no longer keeping `.github/workflows/**` unchanged. Otherwise the',
                  'branch most likely moved while the job was running, and the next',
                  'scheduled run will pick it up.',
                ].join('\n'),
              },
            }[reason];

            if (!details) {
              core.setFailed(`Unrecognized sync failure reason: ${reason}`);
              return;
            }

            const body = `${details.body}\n\n**Error**:\n\n\`\`\`\n${errorMessage}\n\`\`\`\n\nWorkflow run: ${runUrl}`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Sync failed again on ${date} (${reason}).\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: details.title,
                body,
                labels: [label],
                assignees: ['omahasdev']
              });
            }

      - name: Close sync-conflict issues on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict'
            });
            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Fork synced successfully. Closing.'
              });
            }
